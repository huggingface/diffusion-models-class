name: Build documentation

on:
  push:
    branches:
      - main

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@9ad2de8582b56c017cb530c1165116d40433f1c6  # main
    with:
      commit_sha: ${{ github.sha }}
      package: diffusion-models-class
      package_name: diffusion-course
      path_to_docs: diffusion-models-class/
      additional_args: --not_python_module
      convert_notebooks: true
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
